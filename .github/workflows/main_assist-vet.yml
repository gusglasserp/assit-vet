# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - assist-vet

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # O projeto fica em backend/CavaniVets.Api (não na raiz). O publish também copia as páginas
      # de web/ para wwwroot (alvo CopiarPaginas no .csproj).
      # Migrações do banco NÃO rodam aqui: são aplicadas à mão antes do push (ver CLAUDE.md).
      - name: Build with dotnet
        run: dotnet build backend/CavaniVets.Api/CavaniVets.Api.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish backend/CavaniVets.Api/CavaniVets.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B6AEE01D400A4DF4B93F4801B75093F4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BC734EC579924CE89426D8FAA9B33513 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DF9C0493C6A2498FAD69B5AD2D65443D }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'assist-vet'
          slot-name: 'Production'
          package: .
          